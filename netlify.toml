[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security & caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Astro content-hashes every bundled CSS/JS file under /_astro/, so it's
# always safe to cache them forever — a new deploy is served from new URLs.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# Redirect www to apex
[[redirects]]
  from = "https://www.roundrockmasjid.org/*"
  to = "https://roundrockmasjid.org/:splat"
  status = 301
  force = true

# Same-origin proxy for the ICRR events Pinterest board feed.
#
# Pinterest serves the board RSS without an Access-Control-Allow-Origin
# header, so the browser blocks a direct fetch() from our origin. A `status =
# 200` redirect is a Netlify *rewrite*: Netlify fetches the feed server-side
# and serves the bytes under our own domain, so as far as the browser is
# concerned it's a same-origin request and CORS never enters into it.
# Rewrites are free on every plan and don't consume Function invocations.
#
# Keep this rule *after* the www→apex redirect above so a www visitor gets
# normalized to the apex host before this one matches.
[[redirects]]
  from = "/api/pinterest-board"
  to = "https://www.pinterest.com/akaban01/icrr-events.rss"
  status = 200
  force = true
